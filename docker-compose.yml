services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-essvee}
      POSTGRES_USER: ${POSTGRES_USER:-essvee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-essvee}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-essvee} -d ${POSTGRES_DB:-essvee}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-essvee}:${POSTGRES_PASSWORD:-essvee}@db:5432/${POSTGRES_DB:-essvee}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
